steps:
  - id: build-worker
    name: gcr.io/cloud-builders/docker@sha256:fbc05705e6f24467e40ae8a4097ab9b8fae1116551f838fa2c55f4367427fc36
    env: [DOCKER_BUILDKIT=1]
    args:
      - build
      - --platform=linux/amd64
      - --target=production
      - --file=witness-server/worker/Dockerfile.pods
      - --label=org.opencontainers.image.source=https://github.com/404-Repo/404-gen-subnet
      - --label=org.opencontainers.image.revision=${_SOURCE_REV}
      - --tag=europe-west3-docker.pkg.dev/$PROJECT_ID/witness-runtime/pods:main-${_SOURCE_REV}-$BUILD_ID
      - .
  - id: worker-runtime-checks
    name: gcr.io/cloud-builders/docker@sha256:fbc05705e6f24467e40ae8a4097ab9b8fae1116551f838fa2c55f4367427fc36
    args:
      - run
      - --rm
      - --network=none
      - --cpus=2
      - --mount=type=bind,source=/workspace,target=/source,readonly
      - --workdir=/tmp
      - --entrypoint=python
      - europe-west3-docker.pkg.dev/$PROJECT_ID/witness-runtime/pods:main-${_SOURCE_REV}-$BUILD_ID
      - /source/witness-server/worker/tests/container_smoke.py
      - /source
images:
  - europe-west3-docker.pkg.dev/$PROJECT_ID/witness-runtime/pods:main-${_SOURCE_REV}-$BUILD_ID
options:
  machineType: E2_HIGHCPU_8
  logging: CLOUD_LOGGING_ONLY
timeout: 1800s
