[build-system]
requires = ["setuptools==80.9.0"]
build-backend = "setuptools.build_meta"

[project]
name = "404-witness-pod"
version = "0.1.0"
description = "Witness Pod capture, rendering and replay"
requires-python = ">=3.11"

[tool.setuptools.packages.find]
include = ["witness_pod*"]

[tool.setuptools.package-data]
witness_pod = ["py.typed"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = [".", "../../shared", "../../witness-client/src", "../../miner-runtime/src", "../../renderer-client/src"]

[tool.mypy]
python_version = "3.11"
files = ["witness_pod", "tests"]
strict = true
mypy_path = ["../../shared", "../../witness-client/src", "../../miner-runtime/src", "../../renderer-client/src"]

[[tool.mypy.overrides]]
module = ["boto3", "botocore.*"]
ignore_missing_imports = true
