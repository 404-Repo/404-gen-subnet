[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = [".", "../../witness-client/src"]

[tool.mypy]
python_version = "3.11"
files = ["storage.py", "identity.py", "worker.py", "pod.py", "channel.py", "timing.py", "tests"]
strict = true
mypy_path = ["../../witness-client/src", "../../witness-gateway"]

[[tool.mypy.overrides]]
module = ["boto3", "botocore.*", "runpod.*"]
ignore_missing_imports = true
