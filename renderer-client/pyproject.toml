[build-system]
requires = ["setuptools==80.9.0"]
build-backend = "setuptools.build_meta"

[project]
name = "404-renderer-client"
version = "0.1.2"
description = "Thin Python client and replay interface for the 404 Three.js renderer"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
dependencies = ["httpx==0.28.1"]

[project.optional-dependencies]
dev = ["pytest==8.3.5", "ruff==0.14.14", "mypy==1.18.2", "build==1.3.0"]

[tool.setuptools.package-data]
renderer_client = ["py.typed"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
target-version = "py311"
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "S"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101"]

[tool.mypy]
python_version = "3.11"
strict = true
files = ["src"]
