[build-system]
requires = ["setuptools==80.9.0"]
build-backend = "setuptools.build_meta"

[project]
name = "404-witness-gateway"
version = "0.1.0"
description = "Witness gateway and Pod lifecycle control"
requires-python = ">=3.11"

[tool.setuptools.packages.find]
include = ["pod_gateway*"]

[tool.setuptools.package-data]
pod_gateway = ["py.typed"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
filterwarnings = ["error"]

[tool.ruff]
target-version = "py311"
line-length = 120

[tool.mypy]
python_version = "3.11"
files = ["pod_gateway", "tests"]
strict = true
mypy_path = ["../shared", "../witness-client/src", "../miner-runtime/src", "../witness-server/worker", "../miner-reference", "../renderer-client/src"]

[[tool.mypy.overrides]]
module = ["boto3", "botocore.*"]
ignore_missing_imports = true
