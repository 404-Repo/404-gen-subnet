[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
filterwarnings = ["error"]

[tool.ruff]
target-version = "py311"
line-length = 120

[tool.mypy]
python_version = "3.11"
files = ["pod_gateway", "tests"]
strict = true
mypy_path = ["../witness-client/src", "../witness-server/worker"]

[[tool.mypy.overrides]]
module = ["boto3", "botocore.*", "runpod.*"]
ignore_missing_imports = true
