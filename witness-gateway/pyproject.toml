[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
filterwarnings = ["error"]

[tool.ruff]
target-version = "py311"
line-length = 120

[tool.mypy]
python_version = "3.11"
files = ["pod_gateway", "tests"]
strict = true
mypy_path = ["../shared", "../witness-client/src", "../miner-runtime/src", "../witness-server/worker", "../miner-reference", "../renderer-client/src"]

[[tool.mypy.overrides]]
module = ["boto3", "botocore.*"]
ignore_missing_imports = true
