[build-system]
requires = ["setuptools>=84.0.0,<85", "wheel>=0.48.0,<0.49"]
build-backend = "setuptools.build_meta"

[project]
name = "404-miner-runtime"
version = "0.1.0"
description = "Runner and validator execution for subnet 404 miner programs"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
dependencies = ["404-witness-client>=0.2.13rc7,<0.3"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
miner_runtime = ["py.typed"]

[tool.ruff]
target-version = "py311"
line-length = 120

[tool.mypy]
python_version = "3.11"
files = ["src"]
strict = true
mypy_path = ["../witness-client/src"]
