[build-system]
requires = ["setuptools>=84.0.0,<85", "wheel>=0.48.0,<0.49"]
build-backend = "setuptools.build_meta"

[project]
name = "404-witness-client"
version = "0.2.13rc1"
description = "Python client for the subnet 404 TLS witness"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT AND Apache-2.0 AND BSD-3-Clause AND BSD-1-Clause AND SunPro AND LicenseRef-Go-Cephes"
license-files = ["LICENSE", "THIRD_PARTY_NOTICES.md"]
dependencies = [
  "tlslite-ng>=0.8.2,<0.9",
  "cryptography>=50.0.2,<51",
  "httpx>=0.28.1,<0.29",
  "websockets>=17.1,<18",
  "bittensor-wallet>=4.1.0,<5",
  "openai>=3.24.0,<4",
  "pydantic>=2,<3",
]

[project.optional-dependencies]
dev = ["mypy>=2.3.1,<3", "types-setuptools>=84.0.0.20260812,<85", "pytest>=9.0.3,<10"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
witness_client = ["libwitnessproof.so", "libwitnessproof.dylib", "py.typed", "*.pyi"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.mypy]
python_version = "3.11"
files = ["src", "examples", "tests", "setup.py", "build_wheel.py", "queue_live_test.py"]
strict = true
