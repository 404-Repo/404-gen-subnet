[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = [".", "../witness-client/src", "../miner-runtime/src"]

[tool.ruff]
target-version = "py311"
line-length = 120

[tool.mypy]
python_version = "3.11"
strict = true
files = ["main.py", "miner_reference", "tests"]
mypy_path = ["../witness-client/src", "../miner-runtime/src"]
